[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "uk_food_hygiene_analysis"
version = "0.0.1"
description = "An exploratory analysis of the food hygiene in the UK"
authors = [
  { name = "Joryh-IO" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["uk_food_hygiene_analysis"]
include = ["pyproject.toml", "uk_food_hygiene_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["uk_food_hygiene_analysis"]
force-sort-within-sections = true

